; Who Was This From Again - settings (defaults).
; The menu (MCM Helper, needs SkyUI) writes your choices to Data\MCM\Settings\WhoWasThisFromAgain.ini.
; Without the menu you can edit this file, or copy it to Data\MCM\Settings\WhoWasThisFromAgain.ini and
; edit the copy (values there win and survive a mod update). 1 = on, 0 = off.
; The game reads this at start-up; the menu's "Rename letters I have" applies a new name style to
; letters you already carry.

[Groups]
; Which letters get their own name.
bInheritance=1
bBounties=1
bContracts=1
bNotes=1
bDawnguard=1

[Display]
; Put who the letter is from in the name (the hold or person).
bShowSender=1
; Put the person or place it is about in the name.
bShowSubject=1
; 0 = Bounty from Whiterun: Halted Stream Camp
; 1 = Halted Stream Camp - Bounty (Whiterun)
; 2 = Bounty: Halted Stream Camp
iStyle=0
; Save each letter's text when you pick it up and show it when you read it, so it never turns into [...].
bKeepText=1
; Rename the letters you carry each time a save loads.
bReapplyOnLoad=0
